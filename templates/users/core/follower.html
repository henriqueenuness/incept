
<style>
.avatar-sm {
    display: inline-block;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
}

.avatar-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.lista-usuarios {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.item-usuario {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    padding: 8px;
    border-radius: 8px;
    transition: background-color 0.2s;
}

.item-usuario:hover {
    background-color: rgba(0, 0, 0, 0.05);
}

.item-usuario-info {
    display: flex;
    flex-direction: column;
}
</style>
{% extends "base.html" %}
{% block content %}
<h2>{{ titulo }} de {{ perfil_user.nick }}</h2>

<div class="lista-usuarios">
    {% for usuario in usuarios %}
        <a href="{% url 'core_pg' usuario.nick %}" class="item-usuario">
            <span class="avatar-sm">
                <img src="data:image/png;base64,{{ usuario.core_picture }}" alt="{{ usuario.nick }}">
            </span>
            <div class="item-usuario-info">
                <strong>{{ usuario.nick }}</strong>
                {% if usuario.real_name %}
                    <span class="muted">{{ usuario.real_name }}</span>
                {% endif %}
            </div>
        </a>
    {% empty %}
        <p>Nenhum usuário encontrado.</p>
    {% endfor %}
</div>
{% endblock %}
